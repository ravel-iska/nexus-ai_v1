version: "3.9"

services:
  # ─── CORE DATABASES ───
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus_db
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongodata:/data/db"]

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-changeme}
    ports: ["7474:7474", "7687:7687"]
    volumes: ["neo4jdata:/data"]

  # ─── AI / LLM ───
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama_models:/root/.ollama"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ─── BACKEND API ───
  api-backend:
    build:
      context: ./packages/api-backend
      dockerfile: Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      mongodb: { condition: service_started }
    volumes: ["./packages:/app/packages"]
    restart: unless-stopped

  # ─── CELERY WORKER ───
  celery-worker:
    build:
      context: ./packages/api-backend
      dockerfile: Dockerfile
    command: celery -A workers.task_worker worker --loglevel=info --concurrency=4
    env_file: .env
    depends_on: [redis, postgres]
    restart: unless-stopped

  # ─── WA CLIENT ───
  wa-client:
    build:
      context: ./packages/wa-client
      dockerfile: Dockerfile
    env_file: .env
    depends_on: [api-backend, redis]
    volumes:
      - "./packages/wa-client:/app"
      - "wa_sessions:/app/sessions"
    restart: unless-stopped

  # ─── BROWSER AUTOMATION ───
  automation:
    build:
      context: ./packages/automation
      dockerfile: Dockerfile
    env_file: .env
    depends_on: [api-backend]
    volumes: ["./packages/automation:/app"]
    restart: unless-stopped

  # ─── MONITORING ───
  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]
    volumes: ["./infra/prometheus.yml:/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3001:3000"]
    volumes: ["grafanadata:/var/lib/grafana"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

  # ─── ERROR TRACKING (GlitchTip — Sentry-compatible) ───
  glitchtip:
    image: glitchtip/glitchtip:latest
    ports: ["8001:8080"]
    environment:
      DATABASE_URL: postgres://nexus:${POSTGRES_PASSWORD:-changeme}@postgres:5432/glitchtip
      SECRET_KEY: ${APP_SECRET_KEY:-change-me}
      GLITCHTIP_DOMAIN: http://localhost:8001
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
  redisdata:
  mongodata:
  neo4jdata:
  ollama_models:
  wa_sessions:
  grafanadata:
